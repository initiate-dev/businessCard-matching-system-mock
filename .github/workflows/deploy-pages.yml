# main にプッシュしたら GitHub Pages に公開する
# 事前にリポジトリの Settings → Pages → Source を「GitHub Actions」にしておく
name: GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開が重なったら、新しいほうだけ残す
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # サイトは https://<owner>.github.io/<リポジトリ名>/ に置かれるので、その下で動くようにビルドする
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages は SPA の振り分けができないので、知らない URL（再読み込み時など）でも
      # 同じ画面を返せるよう index.html を 404.html としても置く
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
